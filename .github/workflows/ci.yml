name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Lint and Test
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint API
        run: cd apps/api && pnpm run lint
        continue-on-error: true

      - name: Test API
        run: cd apps/api && pnpm run test
        env:
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  # Deploy to Render (builds from source on Render)
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Trigger API Deployment on Render
        run: |
          echo "Triggering API deployment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}" || echo "API deploy hook failed or not configured"
      
      - name: Wait for API deployment
        run: sleep 30
      
      - name: Trigger Web Deployment on Render
        run: |
          echo "Triggering Web deployment..."
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}"
          else
            echo "Web deploy hook not configured"
          fi
