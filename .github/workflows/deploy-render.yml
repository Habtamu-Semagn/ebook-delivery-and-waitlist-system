name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-api:
    name: Deploy API to Render
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Render API Deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_API != '' }}
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"
      
      - name: Wait for deployment
        if: ${{ secrets.RENDER_DEPLOY_HOOK_API != '' }}
        run: sleep 60
      
      - name: Health check
        if: ${{ secrets.API_URL != '' }}
        run: |
          curl -f ${{ secrets.API_URL }}/health || exit 1

  deploy-web:
    name: Deploy Web to Render
    runs-on: ubuntu-latest
    needs: deploy-api
    
    steps:
      - name: Trigger Render Web Deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_WEB != '' }}
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}"
